name: docker-build-and-push
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: selfhosted-runner
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        base-image: ['nvidia/cuda:12.9.0-base-ubuntu24.04', 'nvidia/cuda:12.6.3-base-ubuntu24.04', 'nvidia/cuda:12.4.1-base-ubuntu22.04', 'ubuntu:24.04']
        include:
          - base-image: nvidia/cuda:12.9.0-base-ubuntu24.04
            tag-suffix: -cuda
          - base-image: nvidia/cuda:12.6.3-base-ubuntu24.04
            tag-suffix: -cuda-12.6.3
          - base-image: nvidia/cuda:12.4.1-base-ubuntu22.04
            tag-suffix: -cuda-12.4.1
          - base-image: ubuntu:24.04
            tag-suffix: -cpu
    steps:
      - uses: actions/checkout@v5

      - name: Compute lowercase image name
        run: echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.tag-suffix }},onlatest=true
          tags: |
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base-image }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:buildcache,mode=max